<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#24776c"><link rel="manifest" href="manifest.webmanifest"><title>Лабораторія ОВДП — експеримент 4</title><style>body{font-family:system-ui;background:#edf4f1;color:#203c36;margin:0;padding:22px}main{max-width:540px;margin:auto;background:white;border-radius:22px;padding:24px;box-shadow:0 4px 18px #0001}button{display:block;width:100%;padding:16px;margin:12px 0;border:0;border-radius:12px;background:#287c70;color:white;font-size:16px}button:nth-of-type(2){background:#496b94}#result{white-space:pre-wrap;background:#eaf5f0;padding:16px;border-radius:12px}small{color:#536b64}</style></head><body><main><h1>🔬 Лабораторія ОВДП</h1><p><b>Експеримент №4 · офлайн-запуск</b></p><p>Перевіряємо збереження 194 демонстраційних записів та відкриття сторінки без інтернету.</p><button id="save">1. Зберегти 194 тестові записи</button><button id="read">2. Прочитати збережене</button><p id="status">Перевіряємо готовність офлайн-режиму…</p><div id="result">Результат з'явиться тут.</div><p><small>Тільки демонстраційні дані. Жодних особистих фінансових даних.</small></p></main><script>
const key='ovdp-lab-exp4-demo',result=document.getElementById('result'),status=document.getElementById('status');
document.getElementById('save').onclick=()=>{try{localStorage.setItem(key,JSON.stringify({savedAt:new Date().toLocaleString('uk-UA'),records:Array.from({length:194},(_,i)=>({testId:i+1,kind:'DEMO',label:'Тестовий запис '+(i+1)}))}));result.textContent='✅ Збережено 194 записи';}catch(e){result.textContent='❌ '+e.message}};
document.getElementById('read').onclick=()=>{try{let raw=localStorage.getItem(key);if(!raw){result.textContent='⚠️ Даних ще немає';return}let d=JSON.parse(raw);result.textContent='✅ Дані прочитано\nКількість: '+d.records.length+'\nЗбережено: '+d.savedAt+'\nПерший запис: '+JSON.stringify(d.records[0],null,2)}catch(e){result.textContent='❌ '+e.message}};
if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').then(()=>navigator.serviceWorker.ready).then(()=>{status.textContent='✅ Офлайн-файли підготовлено. Для перевірки відкрий сторінку один раз онлайн, потім вимкни інтернет і відкрий адресу знову.'}).catch(e=>{status.textContent='⚠️ Офлайн-режим не готовий: '+e.message})}else status.textContent='⚠️ Цей браузер не підтримує Service Worker';
</script></body></html>
